<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Watchlist">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1 class="logo">Watchlist</h1>
      <div class="search" id="search">
        <input id="search-input" type="search" placeholder="Search movies and series…" autocomplete="off"
               aria-label="Search movies and series" aria-controls="search-results" aria-expanded="false">
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>
      <a class="logout" href="/logout">Log out</a>
    </div>
  </header>

  <main class="wrap">
    <section class="list-controls" aria-label="List filters">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-type="movie">Movies <span class="count"></span></button>
        <button role="tab" data-type="tv">Series <span class="count"></span></button>
      </div>
      <div class="filters">
        <label class="sort">
          <span class="visually-hidden">Sort by</span>
          <select id="sort">
            <option value="added">Recently added</option>
            <option value="rating">IMDb rating</option>
            <option value="release">Next release date</option>
          </select>
        </label>
      </div>
    </section>

    <p id="list-message" class="list-message" hidden></p>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      This product uses the <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a> API but is not
      endorsed or certified by TMDB. Where-to-watch data provided by JustWatch.
    </div>
  </footer>

  <div id="panel-backdrop" class="panel-backdrop" hidden></div>
  <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
    <button class="panel-close" id="panel-close" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
